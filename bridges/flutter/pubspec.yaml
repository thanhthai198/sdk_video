name: videosdk_player
description: Flutter bridge for VideoSDK (Android ExoPlayer + iOS AVPlayer)
version: 0.1.0
homepage: https://example.com/videosdk

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.videosdk.flutter
        pluginClass: VideosdkPlayerPlugin
      ios:
        pluginClass: VideosdkPlayerPlugin
